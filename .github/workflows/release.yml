name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS_ARM
            runs-on: macos-15
            target: aarch64-apple-darwin
            bundles: app
            ext: zip
          - platform: Windows_x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            ext: exe
          - platform: Windows_ARM
            runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            ext: exe
          - platform: Linux_x64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            ext: Appimage
          - platform: Linux_ARM
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
            ext: Appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.runs-on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2 \
            build-essential \
            file \
            desktop-file-utils \
            xdg-utils

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"   # ad-hoc signing; replace with cert for distribution
          # Signs the in-app updater bundles (verified against the pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package & rename artifact
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          OUT="Archive-UI_v${VERSION}_${{ matrix.platform }}.${{ matrix.ext }}"
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          # UPD = the file the in-app updater downloads; its .sig is kept aside
          # (named after the platform) so the release job can build latest.json.
          case "${{ matrix.bundles }}" in
            app)
              APP=$(ls -d "$BASE/macos/"*.app)
              ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
              UPD="Archive-UI_v${VERSION}_${{ matrix.platform }}.app.tar.gz"
              cp "$(ls "$BASE/macos/"*.app.tar.gz)" "$UPD"
              cp "$(ls "$BASE/macos/"*.app.tar.gz.sig)" "${{ matrix.platform }}.sig"
              ;;
            nsis)
              EXE=$(ls "$BASE/nsis/"*-setup.exe)
              cp "$EXE" "$OUT"
              UPD="$OUT"
              cp "$EXE.sig" "${{ matrix.platform }}.sig"
              ;;
            appimage)
              IMG=$(ls "$BASE/appimage/"*.AppImage)
              cp "$IMG" "$OUT"
              UPD="$OUT"
              cp "$IMG.sig" "${{ matrix.platform }}.sig"
              ;;
          esac
          echo "${{ matrix.platform }}=$UPD" > "${{ matrix.platform }}.upd"
          echo "Produced: $OUT (updater: $UPD)"
          {
            echo "ASSETS<<EOF"
            printf '%s\n' "$OUT" "${{ matrix.platform }}.sig" "${{ matrix.platform }}.upd"
            [ "$UPD" != "$OUT" ] && echo "$UPD"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSETS }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build updater manifest (latest.json)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/whatever-industries/ArchiveUI/releases/download/v${VER}"
          entry() {  # <platform> <updater-target>
            FILE=$(cut -d= -f2- "dist/$1.upd")
            jq -n --arg url "$BASE/$FILE" --rawfile sig "dist/$1.sig" '{($ARGS.named.t): {signature: $sig, url: $url}}' --arg t "$2"
          }
          {
            entry macOS_ARM   darwin-aarch64
            entry Windows_x64 windows-x86_64
            entry Windows_ARM windows-aarch64
            entry Linux_x64   linux-x86_64
            entry Linux_ARM   linux-aarch64
          } | jq -s --arg v "$VER" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{version: $v, notes: "Archive UI v\($v)", pub_date: $d, platforms: add}' > dist/latest.json
          rm dist/*.sig dist/*.upd
          cat dist/latest.json

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="v${VER}"
          BASE="https://github.com/whatever-industries/ArchiveUI/releases/download/${TAG}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Archive UI $TAG" \
            --target "${{ github.sha }}" \
            --notes "Cross-platform builds for \`$TAG\` (commit ${{ github.sha }}).

          ## Download

          | Platform |
          |----------|
          | [**macOS (Apple Silicon)**](${BASE}/Archive-UI_v${VER}_macOS_ARM.zip) |
          | [**Windows (x64)**](${BASE}/Archive-UI_v${VER}_Windows_x64.exe) |
          | [**Windows (ARM)**](${BASE}/Archive-UI_v${VER}_Windows_ARM.exe) |
          | [**Linux (x64)**](${BASE}/Archive-UI_v${VER}_Linux_x64.Appimage) |
          | [**Linux (ARM)**](${BASE}/Archive-UI_v${VER}_Linux_ARM.Appimage) |

          ---

          macOS build is ad-hoc signed — on first launch right-click → Open to bypass Gatekeeper.
          Installed copies update themselves from inside the app." \
            dist/*

          # Keep only the release just published; delete older builds (and their
          # tags) to save space — this app retains a single release at a time.
          gh release list --json tagName --jq '.[].tagName' \
            | grep -vx "$TAG" \
            | while read -r old; do
                [ -n "$old" ] || continue
                echo "Deleting old release $old"
                gh release delete "$old" --yes --cleanup-tag
              done
